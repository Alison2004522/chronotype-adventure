<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <filter id="shadow-h" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Sparkles -->
  <path d="M35 45 L38 52 L45 55 L38 58 L35 65 L32 58 L25 55 L32 52 Z" fill="#FFD54F"/>
  <path d="M165 40 L168 47 L175 50 L168 53 L165 60 L162 53 L155 50 L162 47 Z" fill="#FFD54F"/>
  <circle cx="48" cy="80" r="3" fill="#FF80AB"/>
  <circle cx="152" cy="75" r="3" fill="#69F0AE"/>

  <g filter="url(#shadow-h)">
    <!-- Legs (jumping) -->
    <rect x="76" y="185" width="15" height="28" rx="7" fill="#6D4C41" transform="rotate(-12 83 199)"/>
    <rect x="109" y="185" width="15" height="28" rx="7" fill="#6D4C41" transform="rotate(12 116 199)"/>
    <!-- Shoes -->
    <ellipse cx="78" cy="216" rx="13" ry="7" fill="#4E342E" transform="rotate(-10 78 216)"/>
    <ellipse cx="122" cy="216" rx="13" ry="7" fill="#4E342E" transform="rotate(10 122 216)"/>
    <!-- Body Dress/Shirt -->
    <path d="M60 125 Q100 115 140 125 L146 190 Q100 200 54 190 Z" fill="#FFF8EF" stroke="#E6D7C3" stroke-width="2"/>
    <!-- Apron -->
    <path d="M72 130 L128 130 L136 186 Q100 194 64 186 Z" fill="#F6A9B8"/>
    <!-- Apron Straps -->
    <path d="M75 130 L85 100" stroke="#E598A7" stroke-width="5" stroke-linecap="round"/>
    <path d="M125 130 L115 100" stroke="#E598A7" stroke-width="5" stroke-linecap="round"/>
    <rect x="85" y="150" width="30" height="20" rx="4" fill="#FFFFFF" opacity="0.8"/>
    <path d="M90 156 L110 156" stroke="#E598A7" stroke-width="2" stroke-linecap="round"/>

    <!-- Arms up in cheer! -->
    <path d="M62 130 Q35 100 48 85" fill="none" stroke="#FFE0B2" stroke-width="12" stroke-linecap="round"/>
    <circle cx="48" cy="85" r="7" fill="#FFE0B2"/>
    <path d="M138 130 Q165 100 152 85" fill="none" stroke="#FFE0B2" stroke-width="12" stroke-linecap="round"/>
    <circle cx="152" cy="85" r="7" fill="#FFE0B2"/>

    <!-- Head -->
    <circle cx="100" cy="80" r="42" fill="#FFE0B2"/>
    <!-- Hair back -->
    <path d="M58 80 Q55 120 75 120 Q100 125 125 120 Q145 120 142 80 Z" fill="#5D4037"/>
    <!-- Hair bangs -->
    <path d="M60 75 Q75 50 100 50 Q125 50 140 75 Q120 65 100 70 Q80 65 60 75 Z" fill="#5D4037"/>
    <!-- Ears -->
    <circle cx="58" cy="80" r="8" fill="#FFE0B2"/>
    <circle cx="142" cy="80" r="8" fill="#FFE0B2"/>
    <!-- Blush -->
    <ellipse cx="74" cy="90" rx="8" ry="5" fill="#FF8A80" opacity="0.75"/>
    <ellipse cx="126" cy="90" rx="8" ry="5" fill="#FF8A80" opacity="0.75"/>
    <!-- Joyful Eyes (^ ^) -->
    <path d="M75 80 Q82 72 89 80" fill="none" stroke="#3E2723" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M111 80 Q118 72 125 80" fill="none" stroke="#3E2723" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Eyebrows -->
    <path d="M74 70 Q82 66 89 70" fill="none" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
    <path d="M111 70 Q118 66 125 70" fill="none" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
    <!-- Nose -->
    <ellipse cx="100" cy="85" rx="1.5" ry="1" fill="#FFB74D"/>
    <!-- Big Open Happy Smile (D shape) -->
    <path d="M90 89 Q100 87 110 89 Q110 105 100 105 Q90 105 90 89 Z" fill="#C2185B"/>
    <path d="M93 89 Q100 93 107 89" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M95 101 Q100 98 105 101" fill="#FF8A80"/>

    <!-- Chef Hat (angled merrily) -->
    <g transform="rotate(6 100 40)">
      <rect x="75" y="42" width="50" height="14" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
      <rect x="79" y="45" width="42" height="4" rx="2" fill="#F6A9B8"/>
      <path d="M72 42 C60 26 65 6 85 11 C95 1 110 1 120 11 C135 6 145 24 128 42 Z" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
      <path d="M100 26 C95 20 93 29 100 34 C107 29 105 20 100 26 Z" fill="#FF5252"/>
      <circle cx="100" cy="23" r="1.5" fill="#4CAF50"/>
    </g>
  </g>
</svg>
