<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Body / Clothes -->
  <g filter="url(#shadow)">
    <!-- Legs -->
    <rect x="80" y="190" width="15" height="30" rx="7" fill="#6D4C41"/>
    <rect x="105" y="190" width="15" height="30" rx="7" fill="#6D4C41"/>
    <!-- Shoes -->
    <ellipse cx="87" cy="225" rx="14" ry="7" fill="#4E342E"/>
    <ellipse cx="113" cy="225" rx="14" ry="7" fill="#4E342E"/>
    <!-- Body Dress/Shirt -->
    <path d="M60 130 Q100 120 140 130 L145 195 Q100 205 55 195 Z" fill="#FFF8EF" stroke="#E6D7C3" stroke-width="2"/>
    <!-- Apron -->
    <path d="M72 135 L128 135 L135 192 Q100 198 65 192 Z" fill="#F6A9B8"/>
    <!-- Apron Straps -->
    <path d="M75 135 L85 105" stroke="#E598A7" stroke-width="5" stroke-linecap="round"/>
    <path d="M125 135 L115 105" stroke="#E598A7" stroke-width="5" stroke-linecap="round"/>
    <!-- Apron Pocket -->
    <rect x="85" y="155" width="30" height="22" rx="4" fill="#FFFFFF" opacity="0.8"/>
    <path d="M90 162 L110 162" stroke="#E598A7" stroke-width="2" stroke-linecap="round"/>
    <!-- Arms -->
    <!-- Left Arm holding clipboard -->
    <path d="M62 135 Q40 155 55 175" fill="none" stroke="#FFE0B2" stroke-width="12" stroke-linecap="round"/>
    <!-- Right Arm waving -->
    <path d="M138 135 Q160 145 155 165" fill="none" stroke="#FFE0B2" stroke-width="12" stroke-linecap="round"/>
    <!-- Clipboard in left hand -->
    <rect x="40" y="160" width="26" height="36" rx="3" fill="#8D6E63" transform="rotate(-10 53 178)"/>
    <rect x="44" y="165" width="18" height="26" rx="2" fill="#FFFFFF" transform="rotate(-10 53 178)"/>
    <rect x="48" y="158" width="10" height="5" rx="1" fill="#FFB74D" transform="rotate(-10 53 178)"/>
    <line x1="47" y1="172" x2="59" y2="170" stroke="#BCAAA4" stroke-width="2"/>
    <line x1="48" y1="178" x2="58" y2="176" stroke="#BCAAA4" stroke-width="2"/>
    <line x1="49" y1="184" x2="57" y2="182" stroke="#BCAAA4" stroke-width="2"/>

    <!-- Head -->
    <circle cx="100" cy="85" r="42" fill="#FFE0B2"/>
    <!-- Hair back -->
    <path d="M58 85 Q55 125 75 125 Q100 130 125 125 Q145 125 142 85 Z" fill="#5D4037"/>
    <!-- Hair bangs -->
    <path d="M60 80 Q75 55 100 55 Q125 55 140 80 Q120 70 100 75 Q80 70 60 80 Z" fill="#5D4037"/>
    <!-- Cute Ears -->
    <circle cx="58" cy="85" r="8" fill="#FFE0B2"/>
    <circle cx="142" cy="85" r="8" fill="#FFE0B2"/>
    <!-- Blush -->
    <ellipse cx="76" cy="95" rx="7" ry="4" fill="#FF8A80" opacity="0.6"/>
    <ellipse cx="124" cy="95" rx="7" ry="4" fill="#FF8A80" opacity="0.6"/>
    <!-- Eyes (Big friendly Anime eyes) -->
    <ellipse cx="82" cy="86" rx="5" ry="7" fill="#3E2723"/>
    <ellipse cx="118" cy="86" rx="5" ry="7" fill="#3E2723"/>
    <circle cx="80" cy="84" r="2.2" fill="#FFFFFF"/>
    <circle cx="116" cy="84" r="2.2" fill="#FFFFFF"/>
    <circle cx="83.5" cy="88" r="1" fill="#FFFFFF"/>
    <circle cx="119.5" cy="88" r="1" fill="#FFFFFF"/>
    <!-- Eyebrows -->
    <path d="M76 76 Q82 73 88 76" fill="none" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
    <path d="M112 76 Q118 73 124 76" fill="none" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
    <!-- Nose -->
    <ellipse cx="100" cy="90" rx="1.5" ry="1" fill="#FFB74D"/>
    <!-- Smile -->
    <path d="M94 96 Q100 104 106 96" fill="none" stroke="#C2185B" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Chef Hat -->
    <!-- Hat band -->
    <rect x="75" y="46" width="50" height="14" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
    <rect x="79" y="49" width="42" height="4" rx="2" fill="#F6A9B8"/>
    <!-- Hat puffs -->
    <path d="M72 46 C60 30 65 10 85 15 C95 5 110 5 120 15 C135 10 145 28 128 46 Z" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
    <!-- Small Strawberry on Hat -->
    <path d="M100 30 C95 24 93 33 100 38 C107 33 105 24 100 30 Z" fill="#FF5252"/>
    <circle cx="100" cy="27" r="1.5" fill="#4CAF50"/>
  </g>
</svg>
